<script>
const SHOW_PANEL = false;   // false: the side panel is hidden and leaf boxes open nothing. Panel content is kept.
if (!SHOW_PANEL) document.body.classList.add('nopanel');
// ---------------------------------------------------------------------------
// DATA. Each layer: title, d (panel shown on entering), nodes, edges.
// node: id,label,sub,x,y,w,h,own(built|evolved|others),child(layer id),go(portal layer id),kind(ghost|person|stack),d(panel)
// edge: [from,to,label,style(read|write|designed|dormant),opts{c:[x,y]} control point]
// ---------------------------------------------------------------------------
// Colours: Coupang Play base palette (../assets/coupangplay-tokens.css)
// 4 system colours (logo gradient: orange, magenta, blue, cyan) + 2 status colours (gray external, yellow stale)
const C = {oncall:'#ff8800',alarm:'#ffa185',maint:'#ff4fff',wiki:'#5d9eff',spec:'#00deed',ext:'#989ead',warn:'#ffd13c'};
const SYS = {bot:C.oncall,sched:C.maint,wiki:C.wiki,harness:C.spec,env:C.spec,rec:C.spec};
// Data stores (wiki, repos, histories) draw as cylinders; everything else is a box.
const STORE=new Set(['wiki','skills','sk','tix','alm','svc']);
function cylPath(x,y,w,h){
  const rx=w/2, ry=Math.min(14,h*.14);
  return {ry,
    d:`M${x},${y+ry}A${rx},${ry} 0 0 1 ${x+w},${y+ry}V${y+h-ry}A${rx},${ry} 0 0 1 ${x},${y+h-ry}Z`,
    rim:`M${x},${y+ry}A${rx},${ry} 0 0 0 ${x+w},${y+ry}`};
}
function colorOf(lid,n){ return (n.c&&C[n.c]) || (n.child&&SYS[n.child]) || (n.go&&SYS[n.go]) || ((n.kind==='ghost'||n.kind==='person')?C.ext:SYS[lid]) || C.ext; }

const L = {
root:{title:'AI Harness',
 d:{kind:'Overview',what:'One agent-readable wiki at the centre. Agents pull context from it on every ticket, alarm or delivery stage. A scheduled job closes the loop: nightly it reads the day’s oncall and alarm history, weekly it reads the week’s code changes, and it writes what was learned back into the wiki.',
  how:['Arrows show which way knowledge flows: wiki → agents is context; the scheduler pulls the histories and writes updates to the wiki.','Skills repo is shared: the Oncall Agent and the Spec Workflow stages both load their skills from it.','Oncall Agent and Alarm Agent use the wiki as context; their history is the scheduler’s input.','Wiki Maintainer: diffs the day’s tickets and alarms (nightly) and the week’s merged code changes (weekly) against the wiki and opens an update MR.','Spec Workflow: uses the wiki as context at each stage; its Archive stage files each project back.','The wiki is plain Markdown + YAML in git: index routing, no vector DB.'],
  gotchas:['This is the team’s own wiki, covering every domain the team owns.','Success is judged on real outcomes (MTTR, deflection), not on how much content is added.']},
 nodes:[
  {id:'oncall',label:'Oncall Agent',sub:'answers in chat',x:30,y:50,w:270,h:140,child:'bot'},
  {id:'sched',label:'Wiki Maintainer',sub:'nightly + weekly MRs',x:30,y:280,w:270,h:120,child:'sched'},
  {id:'alarm',label:'Alarm Agent',sub:'triages alarms',c:'alarm',x:30,y:500,w:270,h:140,
   d:{kind:'Agent',what:'Picks up monitoring alarms, pulls the matching runbook / known issue from the wiki, and gathers evidence (logs, metrics, recent deploys) before a human acts.',how:['Same building blocks as the Oncall Agent: same runtime, same wiki, read-only evidence tools.','The difference is the trigger and the output: an alarm starts it, and it writes a triage note instead of a chat answer.','Context: wiki runbooks, Scenario Runbook precedents, service registry.','Output: alarm triage note + its outcome, kept as alarm history.','Alarm history is one of the Wiki Maintainer’s two inputs.'],link:['See the Oncall Agent diagram','bot']}},
  {id:'wiki',label:'AI Wiki',sub:'team knowledge, in git',x:465,y:157,w:270,h:420,child:'wiki'},
  {id:'harness',label:'Spec Workflow',sub:'PRD → code → archive',x:900,y:235,w:270,h:210,child:'harness'},
  {id:'skills',label:'Skills repo',sub:'shared · team-maintained',x:465,y:30,w:270,h:110,
   d:{kind:'Skills repo',what:'The shared, team-maintained repo that the Oncall Agent and the Spec Workflow stages both load their skills from.',how:['Read skills: generic, read-only (for example log search and DB read), each returning a bounded summary.','Domain skills, one folder per domain: when to use it, what to check, which wiki entry and recipe to open (for example a candidate eligibility check, a translation task trace, a slot calendar lookup). They point at wiki entries and hold no copied facts.','Write skills: change pre-prod or config through the platforms, loaded only on a change request.'],guards:[['platform','Every skill calls its platform with a scoped token; the platform enforces least privilege.']]}},
 ],
 edges:[
  ['wiki','oncall','ticket context','read',{c:[420,140]}],
  ['wiki','alarm','alarm context','read',{c:[420,560]}],
  ['sched','oncall','pulls ticket history','read'],
  ['sched','alarm','pulls alarm history','read'],
  ['sched','wiki','update MRs','write',{s:['R','L'],f:[.5,.5]}],
  ['wiki','harness','stage context','read',{s:['R','L'],f:[.35,.35]}],
  ['harness','wiki','archive MR','write',{s:['L','R'],f:[.65,.65]}],
 ]},

// ---------------- ONCALL ----------------
bot:{title:'Oncall Agent',
 d:{kind:'Multi-agent oncall bot',what:'A team-owned routing platform that starts a worker agent for each oncall thread, answering in the team chat. Each team owns its routing platform and its skills repo; each direction the team supports is an oncall skill.',
  how:['Drawn as the design: the AI Wiki is the single source of truth. A domain skill points the worker at the wiki’s knowledge and recipes; nothing is copied into the bot.','Skills repo holds the oncall skills: one per direction, plus generic ones such as log search and DB read. The skills repo and the wiki are maintained by the team.','The worker runs the wiki’s queries through the generic DB-read skill and log search through the generic log-search skill, each returning a bounded summary.','Every answered ticket lands in ticket history, which the Wiki Maintainer reads.'],
  guards:[['platform','Per-run thread history and tool traces in the runtime UI.'],['platform','Least privilege: every platform call carries an authorization token and the platform enforces it. Reads run on the asker’s delegated, scoped token; the bot’s own actions run on a narrow bot-level identity with no restart, rollback or deploy. Never a shared developer identity.']],
  gotchas:['Identity is pinned: an invariant test ensures a worker’s workspace sync can never overwrite the root identity.','No vector store: retrieval is staged file loading.','All agents share one runtime; they differ by prompt, tool allowlist and workspace.','The token is the security boundary and is checked server-side by each platform. Skill and tool allowlists only limit what the agent attempts.']},
 nodes:[
  {id:'chat',label:'Chat thread',sub:'@bot',x:20,y:145,w:150,h:80,kind:'person',
   d:{kind:'Entry',what:'The requester’s thread in the oncall group. The answer comes back here, conclusion first, with SQL / logs hidden unless asked.',guards:[['prompt','Privacy hard stop before any tool call.'],['platform','The asker’s identity is propagated to every tool call, so their own permissions apply.']],gotchas:['Triggered by an explicit @mention, so the requester stays in control of what the bot sees.']}},
  {id:'router',label:'Routing platform',sub:'router agent · ticket history',x:220,y:115,w:220,h:140,
   d:{kind:'Routing platform',what:'The platform that hosts the router agent and stores ticket history. The router agent is the entry point: privacy and language gates, classify by full business intent, start a worker for the thread, or reuse its live one (and call other teams’ routers over agent-to-agent calls), check worker output, write the final answer.',
    how:['Each answered thread (question, evidence, conclusion, handoff) is stored as ticket history. The Wiki Maintainer pulls the day’s history at end of day.','Open an attempt ledger: max 1 worker launch per turn.','Treat worker output as evidence; live / code evidence wins conflicts.','If a handoff is needed, read the live routing doc once.','Causal-conclusion gate, then conclusion-first answer.'],
    guards:[['prompt','One worker launch per turn (circuit breaker) + static test.'],['prompt','Presentation firewall: hide SQL, rows, logs unless asked.'],['prompt','Handoff is a recommendation only.']],
    gotchas:['Route by full business intent, never by IDs alone.','“A wait timeout is not a result”: the router never answers on a timeout.']}},
  {id:'worker',label:'Worker agent',sub:'loads a domain skill',x:510,y:135,w:220,h:100,
   d:{kind:'Worker agent',what:'A generic agent the router agent starts for an oncall thread. Follow-up messages in the thread reach the same worker while it is alive. It loads the matching domain skill, follows it into the wiki, runs the generic read skills and returns a short result. The worker stays alive for 1 hour, then closes.',how:['Same runtime as the router; differs by prompt, tool allowlist and workspace.','Return format is fixed: conclusion, evidence, blockers. No raw rows or logs.','The routing platform keeps no context: raw logs and query results stay in the worker.'],guards:[['code','Read-only tool allowlist: no restart, rollback or deploy capability is granted.'],['code','Log search and DB reads return bounded summaries, not raw output.']],gotchas:['Auth failure ≠ “no data”: retry once, then report the blocker.']}},
  {id:'cskill',label:'Content skill',sub:'read-only · points to wiki',x:810,y:40,w:260,h:90,
   d:{kind:'Domain skill',what:'Answers seller-content questions. A thin procedure: when to use it, which wiki entries to open, which generic read skills to call. Domain facts and log recipes stay in the wiki.',how:['Points at the wiki’s content entries and recipes (referenced, never copied).','Needs a seller id; bounded SELECTs over its content tables, using the wiki’s query through the generic DB-read skill.','Passes the wiki’s log recipe (service, error codes, window) to the generic log-search skill.','Read-only: changes go through the separate write skills, which load only on a change request.'],guards:[['prompt','Wiki docs are evidence sources, never its write area.']]}},
  {id:'wskill',label:'Write skills',sub:'gated · change requests only',x:810,y:140,w:260,h:90,
   d:{kind:'Domain skill',what:'The bot’s only write paths: allowlist change, a DB row change and a serverless timer trigger. Separate from the content skill so a read-only question never loads them.',how:['Each action goes through another platform’s ticket or trigger, never a direct write.','Draft first, preview, then apply on explicit request.'],guards:[['platform','Release pipeline’s human approval node.'],['code','Draft helper only previews unless --apply is passed.'],['platform','Timer-trigger path requires a second-person approval before it runs.']]}},
  {id:'oskill',label:'Onboarding skill',sub:'same flow as content',x:810,y:240,w:260,h:90,kind:'ghost',
   d:{kind:'Domain skill',what:'Answers seller-onboarding questions with the same flow as the content skill, pointed at the wiki’s onboarding entries and recipes.'}},
  {id:'ext',label:'External agents',sub:'agent-to-agent calls',x:510,y:400,w:220,h:76,kind:'ghost',
   d:{kind:'External agents',what:'Routers and agents owned by other teams (product platform, datasets, governance), called over agent-to-agent calls. The router validates their result against an agreed result contract.'}},
  {id:'wiki',label:'AI Wiki',sub:'knowledge + recipes',x:1130,y:45,w:300,h:80,go:'wiki'},
  {id:'plat',label:'Platforms',sub:'DB · logs · config · tickets',x:1130,y:140,w:300,h:90,kind:'ghost',
   d:{kind:'Platforms',what:'Internal systems the agents call as tools. Owned by other teams; the bot only holds credentials to them.',
    how:['Read: the worker runs the wiki’s queries and reads logs, config and deploy state through the generic read skills.','Write (write skills only): config change via a release ticket, prod DB row change via a DB release ticket, serverless timer trigger.','Restart, rollback and deploy are outside the bot’s tool allowlist.'],
    guards:[['code','Prod DB: SELECT / SHOW / DESCRIBE only, regex gate before any call.'],['platform','Release ticket and DB release stop at a human approval node.'],['platform','Timer trigger needs a second-person approval before it runs.'],['platform','Calls use the asker’s delegated per-user credentials (least privilege), not a shared identity.']]}},
  {id:'gskill',label:'Generic skills',sub:'log search · DB read',x:810,y:340,w:260,h:90,
   d:{kind:'Domain skill',what:'Generic skills shared by every domain skill: log search and DB read. They take a recipe or query from the wiki and return a bounded summary, never raw logs or rows.',guards:[['platform','Authorization is the caller’s token, enforced by the platform: shared skills never widen access, because each consumer calls with its own token.'],['code','Read-only skills.'],['code','Output is a bounded summary: top hits, window, counts.']],gotchas:['Live in the team’s skills repo like the domain skills. Starter versions can come from the same template the wiki is scaffolded from.']}},
  {id:'sched',label:'Wiki\nMaintainer',sub:'nightly + weekly',x:255,y:400,w:150,h:80,go:'sched'},
 ],
 edges:[
  ['chat','router','@mention','read'],
  ['router','worker','starts worker','read',{s:['R','L'],f:[.5,.5]}],['router','ext','','read',{s:['B','L'],f:[.95,.5]}],
  ['worker','cskill','loads skill','read',{s:['T','L'],f:[.9,.5]}],
  ['worker','wskill','change request','read',{s:['R','L'],f:[.5,.5]}],
  ['wiki','cskill','knowledge + recipes','read'],
  ['gskill','plat','log search · DB read','read',{s:['R','B'],f:[.5,.5]}],
  ['wskill','plat','tickets · trigger','read',{s:['R','L'],f:[.5,.5]}],
  ['sched','router','pulls history','read',{s:['T','B'],f:[.5,.5]}],
 ]},

// ---------------- WIKI MAINTAINER ----------------
sched:{title:'Wiki Maintainer',
 d:{kind:'Scheduled job',what:'A scheduled job with two runs. Nightly, it polls the day’s oncall ticket history and alarm history. Weekly, it reads the week’s merged changes in the registered service repos. Each run compares what changed with what the wiki says and opens update MRs for the wiki, after its question evals pass.',
  how:['Trigger: nightly for tickets and alarms, weekly for code changes.','Collect → compare with the wiki → draft entries → run evals → open MR → review → merge.','Tomorrow’s Oncall and Alarm agents read the updated wiki: the loop closes without anyone remembering to write docs.'],
  guards:[['prompt','No PII: entries cite only the ticket / alarm id.'],['code','Wiki CI (link check, PII / secret scan, freshness lint) runs on every MR it opens.'],['platform','Human review on the MR before merge.'],['platform','Maintainer bot identity: pushes only to maintainer/* branches and opens MRs. It cannot merge, edit CI config or bypass branch protection; code owners per wiki area approve.'],['code','Evals run before any MR is opened: a drop in score holds the draft instead of opening a PR.']],
  gotchas:['Past Scenario Runbook entries are hypotheses, not answers: an agent tests an entry against the current evidence, and the Maintainer only updates one when the day’s evidence ties to it.','MR budget: each MR holds at most N entries and the overflow carries to the next day, so a reviewer can actually read it. A P0 or postmortem finding takes a fast path: its own small MR straight away, through the same evals and CI.']},
 nodes:[
  {id:'cron',label:'Trigger',sub:'nightly + weekly',x:20,y:30,w:220,h:80,
   d:{kind:'Trigger',what:'Two schedules start the same pipeline.',how:['Nightly, after the oncall shift ends: the day’s ticket and alarm history.','Weekly: the week’s merged changes in the registered service repos.']}},
  {id:'tix',label:'Ticket history',sub:'today’s threads',x:20,y:150,w:220,h:90,go:'bot'},
  {id:'alm',label:'Alarm history',c:'alarm',sub:'today’s alarms',x:20,y:280,w:220,h:90,
   d:{kind:'Input',what:'The Alarm Agent’s output for the day: which alarms fired, what evidence was gathered, how each one was resolved.'}},
  {id:'repos',label:'Service repos',sub:'this week’s merges',x:20,y:410,w:220,h:90,go:'wiki',
   d:{kind:'Input',what:'The week’s merged changes in the service repos listed in the wiki’s service registry. Used to find wiki entries the code no longer matches and new behaviour the wiki does not cover yet.',guards:[['platform','Read-only access to the repos.']]}},
  {id:'collect',label:'1 · Collect',sub:'scrub · group',x:270,y:290,w:150,h:120,
   d:{kind:'Step',what:'Nightly: pull the day’s tickets and alarms and cluster them by symptom and service, so repeats collapse into one candidate. Weekly: pull the week’s merged changes and group them by service.',guards:[['code','Personal data and secrets are stripped from tickets before the model sees them.'],['code','Only history with a human-confirmed outcome (ticket resolved and the agent’s reply rated by the engineer, or alarm triage confirmed) can create or change an entry. Agent-only answers are logged but never promoted, so the wiki cannot reinforce its own mistakes.'],['code','An unrated ticket is skipped: no rating, no learning.']]}},
  {id:'diff',label:'2 · Compare',sub:'new · outdated · review',x:450,y:290,w:150,h:120,
   d:{kind:'Step',what:'Walk the wiki index for each cluster and compare findings with the wiki claims that were used.',how:['Each finding marked New (no entry) or Outdated (entry contradicted by new evidence or a code change).','Entries past their review interval, or unused for N days, are flagged Review / Archive for a human to confirm.','No change → nothing to write.']}},
  {id:'draft',label:'3 · Draft',sub:'entries + index',x:630,y:290,w:150,h:120,

// Focus = the selected box, else the hovered one. Its links go cyan and carry dots; the rest fade back.
function applyFocus(ctx){

  for(const {id,g} of ctx.nodes) g.classList.toggle('dim',!!rel&&!rel.has(id));
  for(const e of ctx.edges){
    const on=!rel||(rel.has(e.a)&&rel.has(e.b)&&(e.a===f||e.b===f)), hot=!!rel&&on, col=hot?'#00eafa':'#b5b9c4';
    e.path.setAttribute('stroke',col);
    e.path.setAttribute('stroke-opacity',on?(hot?.95:.55):.08);
    e.path.setAttribute('stroke-width',hot?2.6:e.style==='write'?3:1.7);
    e.path.setAttribute('stroke-dasharray',e.style==='designed'?'7 6':e.style==='dormant'?'0.1 6':'');
    e.path.setAttribute('stroke-linecap',e.style==='dormant'?'round':'butt');
    e.path.setAttribute('marker-end',`url(#${marker(col)})`);
    e.dots.setAttribute('display',hot?'inline':'none');
    if(e.text){ e.text.setAttribute('opacity',on?1:0); e.text.setAttribute('fill',hot?'#00eafa':'rgba(255,255,255,.7)'); e.text.setAttribute('font-weight',hot?700:500); }
  }
}

const panel=document.getElementById('panel');
function fitPanel(){panel.style.bottom=document.getElementById('legend').offsetHeight+'px';}
fitPanel(); addEventListener('resize',fitPanel);
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function schemaHtml(t){
  let h=`<div class="stag">Table schema</div><h2><code>${esc(t.name)}</code></h2><p>${esc(t.desc)}</p><h4>Columns</h4><div class="ex-tbl"><table><tr><th>column</th><th>type</th><th>note</th></tr>${t.cols.map(c=>`<tr><td><b>${esc(c[0])}</b></td><td>${esc(c[1])}</td><td style="white-space:normal;min-width:200px">${esc(c[2])}</td></tr>`).join('')}</table></div>`;
  if(t.keys) h+=`<h4>Keys</h4><ul>${t.keys.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>`;
  if(t.rows) h+=`<h4>Sample rows (illustrative)</h4><div class="ex-tbl"><table><tr>${t.rowCols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${t.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  return h;
}
function openSchema(t){document.getElementById('sc').innerHTML=schemaHtml(t);document.body.classList.add('schema');}
function closeSchema(){document.body.classList.remove('schema');}
function showPanel(title,d,own,extra){
  d=d||{};
  let h=`<h2>${esc(title)}</h2><div class="kind">${esc(d.kind||'')}</div>`;
  if(extra) h+=extra;
  if(d.what) h+=`<p>${esc(d.what)}</p>`;
  if(d.how&&d.how.length) h+=`<h4>How it works</h4><ul>${d.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  const schemas=d.schema?(Array.isArray(d.schema)?d.schema:[d.schema]):[];
  if(schemas.length) h+=`<h4>Table schema</h4><div class="sbtns">${schemas.map((t,i)=>`<button class="sbtn" data-sch="${i}"><code>${esc(t.name)}</code> ▸</button>`).join('')}</div>`;
  if(d.link) h+=`<p><a class="jl" data-go="${esc(d.link[1])}" style="color:#95b9ff;cursor:pointer;text-decoration:underline">${esc(d.link[0])} ↗</a></p>`;
  if(d.guards&&d.guards.length) h+=`<h4>Guardrails</h4><ul>${d.guards.map(([k,x])=>`<li><span class="g ${k}">${k}</span>${esc(x)}</li>`).join('')}</ul>`;
  if(d.gotchas&&d.gotchas.length) h+=`<h4>Nuances</h4><ul>${d.gotchas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(d.equiv) h+=`<h4>Industry equivalent</h4><p>${esc(d.equiv)}</p>`;
  panel.innerHTML=h; panel.scrollTop=0;
  panel.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>openSchema(schemas[+b.dataset.sch]));
  panel.querySelectorAll('a.jl').forEach(a=>a.onclick=()=>{if(!busy) jump(a.dataset.go);});
}
function showLayerPanel(){const lay=L[cur]; showPanel(lay.title,lay.d,lay.d.own,`<p style="opacity:.6;font-size:12px">You’re inside this layer. Click a component for details.</p>`);}

function onNode(lid,n,gEl,ctx){
  if(busy) return;
  if(n.child) return drill(n);
  if(n.go) return jump(n.go);
  if(!SHOW_PANEL) return;
  stage.querySelectorAll('rect.box').forEach(r=>r.removeAttribute('filter'));
  ctx.sel=n.id; applyFocus(ctx);
  showPanel(n.label.replace(/\n/g,' '),n.d,n.own);
  gEl.querySelector('rect.box').setAttribute('filter','drop-shadow(0 0 8px #ffffff66)');
}

// ---------------------------------------------------------------------------
// NAVIGATION + ZOOM ANIMATION
// ---------------------------------------------------------------------------
function fitM(n){ // matrix that maps full layer into node rect (aspect fit)
  const s=Math.min(n.w/VW,n.h/VH); return {s,tx:n.x+(n.w-VW*s)/2,ty:n.y+(n.h-VH*s)/2};
}
function inv(m){return {s:1/m.s,tx:-m.tx/m.s,ty:-m.ty/m.s};}
const ID={s:1,tx:0,ty:0};
function lerp(a,b,t){return {s:a.s+(b.s-a.s)*t,tx:a.tx+(b.tx-a.tx)*t,ty:a.ty+(b.ty-a.ty)*t};}
function setM(g,m,o){g.setAttribute('transform',`translate(${m.tx},${m.ty}) scale(${m.s})`); g.setAttribute('opacity',o);}
function animate(oldG,newG,oFrom,oTo,nFrom,nTo,done){
  busy=true; vbFrom=vb; vbTo=fitVB(cur); const t0=performance.now(), D=520;
  (function step(now){
    let t=Math.min(1,(now-t0)/D); const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    if(oldG) setM(oldG,lerp(oFrom,oTo,e),1-e);
    setM(newG,lerp(nFrom,nTo,e),e);
    setVB(vbFrom.map((f,i)=>f+(vbTo[i]-f)*e));
    if(t<1) requestAnimationFrame(step); else {if(oldG) oldG.remove(); busy=false; done&&done();}
  })(t0);
}
let curG=null;
function drill(n){
  const m=fitM(n), newG=render(n.child);
  const oldG=curG; curG=newG; path.push(n.child); cur=n.child; ui();
  animate(oldG,newG,ID,inv(m),m,ID);
}
function up(){
  if(busy||path.length<2) return;
  const child=path.pop(), parent=path[path.length-1];
  const n=L[parent].nodes.find(x=>x.child===child), m=fitM(n);
  const newG=render(parent), oldG=curG; curG=newG; cur=parent; ui();
  animate(oldG,newG,ID,m,inv(m),ID);
}
function jump(lid){ // crossfade to any layer
  if(busy) return; path=pathTo(lid); cur=lid;
  const newG=render(lid), oldG=curG; curG=newG; ui();
  animate(oldG,newG,ID,{s:.92,tx:VW*.04,ty:VH*.04},{s:1.06,tx:-VW*.03,ty:-VH*.03},ID);
}
function goPath(i){ if(busy) return; if(i===path.length-1) return; if(i===path.length-2) return up(); jump(path[i]); }
function ui(){
  const c=document.getElementById('crumbs');
  c.innerHTML=path.map((id,i)=>i===path.length-1?`<span class="cur">${esc(L[id].title)}</span>`:`<a data-i="${i}">${esc(L[id].title)}</a><span class="sep">›</span>`).join('');
  c.querySelectorAll('a').forEach(a=>a.onclick=()=>goPath(+a.dataset.i));
  document.getElementById('up').disabled=path.length<2;
  showLayerPanel();
}
document.getElementById('up').onclick=up;
document.getElementById('schema').addEventListener('click',e=>{ if(e.target.id==='schema'||e.target.id==='sclose') closeSchema(); });
document.getElementById('s').addEventListener('click',()=>{ if(!busy){stage.querySelectorAll('rect.box').forEach(r=>r.removeAttribute('filter')); if(curG&&curG._ctx){curG._ctx.sel=null; applyFocus(curG._ctx);} showLayerPanel();} });
addEventListener('keydown',e=>{ if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault(); if(document.body.classList.contains('schema')) closeSchema(); else up();} });

// boot from hash: #l=wiki opens that layer (used by the deck's episodes)
const hl=location.hash.match(/l=(\w+)/);
cur=hl&&L[hl[1]]?hl[1]:'root'; path=pathTo(cur); curG=render(cur); ui(); setVB(fitVB(cur));
if(!SHOW_PANEL){ const fitWrap=()=>document.getElementById('wrap').style.bottom=document.getElementById('legend').offsetHeight+'px'; fitWrap(); addEventListener('resize',fitWrap); }
</script>
</body></html>
